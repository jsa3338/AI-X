
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문제 2 박스 레이아웃</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .cool-button{
            background-color: black;
            color: white;
        }
        .cool-button:hover{
            background-color: white;
            color: black;
        }
        .cool-button:active{
            transform: translateY(2px);
        }
        

    </style>
</head>
<body>
    <button class="cool-button">클릭해봐!</button>

</body>
</html>
