<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>
        
    </style>
    <script>
        // window가 load 될때
        // window.addEventListener('load', ()=>{});
        // html DOM트리가 완성될때
        document.addEventListener('DOMContentLoaded', ()=>{
            document.querySelector('button').addEventListener('click', ()=>{
                let id = document.querySelector('input[name=id]').value;
                let params = new URLSearchParams({id:id});
                //console.log('exist.html?id='+id);
                console.log(`exist.html?id=${id}`) // 홑따옴표가 아닌 `` 틸드. 파이썬의 fstring과 비슷한 역할을 해준다
                console.log(`exist.html?${params}`)
                //비동기 처리함수, 비동기 작업의 결과를 약속하는 함수 == fetch(요청경로, 메소드방식)
                fetch(`exist.html?${params}`,{method:'get'})
                    .then( response=>{  
                        // response는 응답객체라고 한다. 해당 요청에 대한 html결과와 다양한 프로토콜(헤더정보(code, status, ...))를 포괄해서 온다
                        if(!response.ok){  // 요청경로의 응답이 정상적으로 왔는지 여부 체크
                            throw new Error(`${response.status} / ${response.statusText}`);  // throw 를 사용해 Error라는 예외객체를 생성. 실행되면 끝.
                        }
                        return response.text();                    
                })
                .then(data=>{
                    document.querySelector('span#idConfirm').innerHTML = data.trim();
                })
                .catch(error=> {
                    alert(error.message);
                })
                ;//fetch

            });// click event
        }); // DOMContentLoaded
    </script>
</head>
<body>
    아이디 <input type="text" name="id" autocomplete="off"><button>중복체크</button><br>
    <span id="idConfirm"></span>
</body>
</html>
