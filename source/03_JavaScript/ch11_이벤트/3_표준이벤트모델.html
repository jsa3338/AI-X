<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>
        
    </style>
    <script>
        window.onload = ()=> {
            var h1 = document.getElementById('header');
            // h1.onclick = function(){};
            // 표준이벤트모델은 이벤트 리스너를 추가하는 방식. 2015년 이후 표준. 이벤트 이름을 알아야함
            // 객체.addEventListener(이벤트이름, 리스너함수)
            h1.addEventListener('click', function(){
                alert('클릭했네');
                this.innerHTML = '클릭을 해버렸어'; // this를 쓰려면 화살표 함수 불가
                this.style.color='blue'
            });
            // alert(h1.onclick);
        };
    </script>
</head>
<body>
    <h1 id="header">click 해봐</h1>
    
</body>
</html>
