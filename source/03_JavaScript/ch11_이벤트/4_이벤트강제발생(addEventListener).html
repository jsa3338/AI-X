<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>
        
    </style>
    <script>
        window.addEventListener('load', () => {
            var btnA = document.getElementById('btnA');
            var btnB = document.querySelector('button#btnB');
            let cntA = document.getElementById('cntA');
            let cntB = document.querySelector('#cntB');
            btnA.addEventListener('click', ()=>{
                cntA.innerHTML = Number(cntA.innerHTML) + 1; // cntA.innerHTML +=1
                //btnB를 강제 클릭 이벤트 발생
                btnB.click();
            });
            btnB.addEventListener('click', ()=>{
                cntB.innerHTML = Number(cntB.innerHTML) + 1; 
            });
        });
        
    </script>
</head>
<body>
    <button id="btnA">BUTTON A</button>
    <button id="btnB">BUTTON B</button>
    <h1>Button A 클릭횟수 : <span id="cntA">0</span></h1>
    <h1>Button B 클릭횟수 : <span id="cntB">0</span></h1>
</body>
</html>
