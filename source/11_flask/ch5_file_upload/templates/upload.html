{% extends 'base.html' %}  # 상위 템플릿을 참조
{% block title %}
업로드 페이지
{% endblock %}
{% block content %}
<body>
{# bootstrap 5.2의 jumbotran 페이지 사용#}
    <div class="container py-4">
        <div class="p-5 mb-4 bg-light rounded-3">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold">파일 업로드</h1>
                <hr style="color: red;" />
                <img src="{{ url_for('static', filename='img/upload.png') }}" alt="upload logo" width="90" height="90">
                <form action="" method="post" enctype="multipart/form-data"> <!-- 업로드 폼 설정-->
                    <!--<input type="file" name="files"/> -->
                    {{ form.csrf_token }}
                    {{ form.files }}
                    <input type="submit" value="업로드" class="btn btn-primary btn-lg"/>
            </div>
        </div>
    </div>
</body>
{% endblock %}
